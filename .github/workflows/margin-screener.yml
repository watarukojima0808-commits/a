name: 信用残スクリーニング

# 平日朝の定期実行は Claude のルーティン「信用残スクリーニング（平日朝）」に移管した。
# ルーティンは同じ 8:00 JST に走り、結果をプッシュ通知で届ける。
# ここに cron を残すと、デフォルトブランチへマージした時点で二重実行になるため置いていない。
# 手動で回したいときのために workflow_dispatch だけ残す (デフォルトブランチでのみ利用可)。
on:
  workflow_dispatch:
    inputs:
      inspect:
        description: 'JPXファイルの構造確認のみ行う (デバッグ用)'
        required: false
        default: 'false'
      weeks:
        description: '参照する週次データの数'
        required: false
        default: '5'
      top:
        description: '各リストの掲載数'
        required: false
        default: '15'

# 同時実行を防ぐ (手動実行が重なった場合の push 衝突対策)
concurrency:
  group: margin-screener
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 一度公表された週次PDFは中身が変わらないので、実行のたびに5週分を
      # JPXから取り直さないよう、ダウンロード済みPDFをキャッシュする。
      # キーを毎回変えて必ず保存し、restore-keys で直近のキャッシュを引き継ぐ。
      - name: 週次PDFのキャッシュ
        uses: actions/cache@v4
        with:
          path: .cache/jpx
          key: jpx-margin-pdf-${{ github.run_id }}
          restore-keys: jpx-margin-pdf-

      # 銘柄別信用取引週末残高はPDFで公表されているため pdfplumber が必要。
      # xlrd は将来Excel形式に戻った場合の保険。
      - name: 依存ライブラリをインストール
        run: pip install pdfplumber xlrd

      # 解析が落ちたときにJPXのレイアウト変更を切り分けるための確認用。
      - name: JPXファイルの構造確認
        run: python margin_screener.py --inspect 2>&1 | tee inspect.txt
        continue-on-error: true

      - name: スクリーニング実行
        if: inputs.inspect != 'true'
        run: |
          set -o pipefail
          python margin_screener.py \
            --weeks "${{ inputs.weeks || '5' }}" \
            --top "${{ inputs.top || '15' }}" \
            --out-dir reports/margin 2>&1 | tee result.txt

      # キャッシュが際限なく膨らまないよう、新しい10週分だけ残す。
      # ファイル名 (syumatsu2026072400.pdf) は辞書順=日付順になっている。
      - name: 古いPDFキャッシュを整理
        if: always()
        run: |
          ls -1 .cache/jpx/*.pdf 2>/dev/null | sort -r | tail -n +11 | xargs -r rm -f
          ls -1 .cache/jpx 2>/dev/null | wc -l | xargs echo "キャッシュ保持数:"

      - name: 結果をサマリに表示
        if: always()
        run: |
          {
            if [ -f inspect.txt ]; then
              echo '## 構造確認ログ'
              echo '```'
              tail -n 120 inspect.txt
              echo '```'
            fi
            echo '## 実行ログ'
            echo '```'
            cat result.txt 2>/dev/null || echo 'なし'
            echo '```'
            latest=$(ls -1 reports/margin/*.md 2>/dev/null | tail -n 1)
            if [ -n "$latest" ]; then
              echo ''
              cat "$latest"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 結果をコミット
        if: inputs.inspect != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/margin
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "信用残スクリーニング結果 $(TZ=Asia/Tokyo date +%Y-%m-%d)"
            git push
          fi
