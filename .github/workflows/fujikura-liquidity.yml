name: フジクラ 流動性マップ

on:
  schedule:
    # 平日 8:00 JST (= UTC 23:00 日〜木)。GitHubのスケジュールは数分〜20分遅れることがある。
    - cron: '0 23 * * 0-4'
  workflow_dispatch:

concurrency:
  group: fujikura-liquidity
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 休場日は前回と同じ日付のレポートになるため、保存済みならスクリプト側で送信を止める。
      - name: レポート作成と送信
        env:
          GMAIL_FROM: ${{ secrets.GMAIL_FROM }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
        run: python stock_liquidity.py --code 5803 --out-dir reports/liquidity

      - name: 結果をコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/liquidity
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "流動性マップ $(TZ=Asia/Tokyo date +%Y-%m-%d)"
            git push
          fi
